server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nota: nginx no hereda add_header del server si el location define los suyos,
    # por eso las cabeceras de seguridad se repiten en cada location.

    # JS/CSS y media llevan hash en el nombre (outputHashing: all): se cachean sin límite.
    # (favicon.svg y demás archivos de public/ no llevan hash, por eso quedan fuera).
    location ~* (\.(?:js|css)$|^/media/) {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fallback SPA: cualquier ruta que no sea un archivo devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
